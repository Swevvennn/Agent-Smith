[project]
name = "agent-smith"
version = "0.1.0"
description = "Agentic framework for MBPP and SWE-bench (Agent Smith project)"
requires-python = "==3.10.*"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.scripts]
sandbox = "student.sandbox_entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["student"]
